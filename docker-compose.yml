services:
  db:
    image: postgres:16
    container_name: erp_postgres
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    # Host port 5434 to avoid colliding with any native PostgreSQL on 5432.
    ports:
      - "5434:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Job broker ONLY (arq). No research data lives here; losing it loses no ledger
  # history. Postgres remains the system of record / ledger / cache / idempotency
  # store (see ADR-007 Amendment 2026-06-17). Host port 6380 avoids colliding with
  # any Redis already on 6379.
  redis:
    image: redis:7-alpine
    container_name: erp_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  erp_pgdata:
