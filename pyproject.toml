[project]
name = "equity-research-platform"
version = "0.1.0"
description = "Equity research platform — Phase 0 spine (immutable research ledger, hexagonal)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "structlog>=24.1",
    "arq>=0.26",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "fastapi>=0.137.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "import-linter>=2.0",
    "httpx>=0.28.1",
    # ASGI server to run the FastAPI app over HTTP for the web/ Playwright E2E
    # harness (the unit/api tests use Starlette's in-process TestClient instead).
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests that require a live PostgreSQL (docker-compose). Deselect with -m 'not db'.",
    "live: opt-in tests that make a real Anthropic API call (need ANTHROPIC_API_KEY). Deselected by default.",
]

# Default test run excludes live API tests (no network/key required).
addopts = "-m 'not live'"

# import-linter reads .importlinter at the repo root (see that file).
